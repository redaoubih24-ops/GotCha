<svg
  xmlns="http://www.w3.org/2000/svg"
  width="600"
  height="400"
  viewBox="0 0 600 400"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">A reversible wireframe cube</title>
  <desc id="desc">
    Two equal offset squares connected at their four corners. All twelve edges have identical
    weight, with no shading, hidden lines, or occlusion to select which face is nearer.
  </desc>
  <rect width="600" height="400" rx="12" fill="#fffdf6" />
  <!-- Both squares and all four connecting edges stay fully visible. -->
  <g fill="none" stroke="#18221a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <path d="M155 135H335V315H155Z" />
    <path d="M265 55H445V235H265Z" />
    <path d="M155 135L265 55M335 135L445 55M335 315L445 235M155 315L265 235" />
  </g>
</svg>
